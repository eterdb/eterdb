# Publish EterDB container images to GHCR (ghcr.io/eterdb/…).
#
# Builds + pushes the TWO images the stack runs (docker-compose.yml), so a plain
# `docker compose up` PULLS them instead of compiling Postgres from source:
#   - ghcr.io/eterdb/engine:pg18         (patched PG18 + eter_ssi + eter SQL, observe-ready)
#   - ghcr.io/eterdb/control-plane:pg18  (FROM engine + meta Postgres + capture + orchestrator, supervised)
#
# Runs on a published GitHub Release and on manual dispatch. control-plane is built FROM
# the just-pushed engine image, so engine is built + pushed first.
#
# Multi-arch: linux/amd64 + linux/arm64. arm64 is built under QEMU emulation (simple +
# correct); since the engine compiles Postgres from source, the emulated arm64 leg is
# slow, if it becomes a problem, split arm64 onto a native `ubuntu-24.04-arm` runner
# (build-by-digest + a manifest-merge job). After the first push, set both GHCR packages
# to **public** in the org (Packages → package → visibility) so anonymous `docker pull` works.
name: publish-images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      pg_major:
        description: Postgres major to build
        default: "18"
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: eterdb
  PG_MAJOR: ${{ github.event.inputs.pg_major || '18' }}

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3   # arm64 emulation for the multi-arch build

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1) engine, patched PG + eter_ssi + eter SQL. Built + pushed first so
      #    control-plane can build FROM it.
      - name: Build + push engine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.engine
          build-args: PG_MAJOR=${{ env.PG_MAJOR }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/engine:pg${{ env.PG_MAJOR }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/engine:pg${{ env.PG_MAJOR }}-${{ github.sha }}

      # 2) control-plane, FROM the engine image just pushed above (meta Postgres +
      #    capture + orchestrator, supervised, the whole control plane in one image).
      - name: Build + push control-plane
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.control-plane
          build-args: ENGINE_IMAGE=${{ env.REGISTRY }}/${{ env.ORG }}/engine:pg${{ env.PG_MAJOR }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/control-plane:pg${{ env.PG_MAJOR }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/control-plane:pg${{ env.PG_MAJOR }}-${{ github.sha }}
