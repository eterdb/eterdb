# CI, enforce that the public repo's green claims hold: the Go CLI, sidecars,
# and orchestrator build/vet/test, plus static analysis (golangci-lint, gosec via
# golangci, govulncheck) and cppcheck over the C extension. (The TypeScript
# packages were retired, the Go orchestrator superseded the eter-server, and the
# flight-recorder dashboard was removed.) The patched-engine suites (ssi /
# observe / false-clean / e2e / storage-pitr / orchestrator) need a from-source
# or pulled Postgres and run as a separate, slower workflow, a follow-up.
#
# The Go and C jobs are path-gated by the `changes` job: a docs- or site-only
# change skips them entirely. Skipped jobs still satisfy branch protection
# (GitHub treats a skipped required check as passed). Touching this workflow
# re-runs everything, and the Go build/test job also runs on changes to the
# engine SQL / demo schema because cli embeds copies of both and
# TestEmbeddedAssetsInSync is the drift gate for them.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pinned to match the `toolchain` directive in both go.mod files. Bump both
# together; the pin exists because govulncheck flagged a crypto/tls fix shipped
# only in this patch release (GO-2026-5856).
env:
  GO_VERSION: "1.26.6"
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter reads the PR file list via the API
    outputs:
      go: ${{ steps.filter.outputs.go }}
      goassets: ${{ steps.filter.outputs.goassets }}
      c: ${{ steps.filter.outputs.c }}
    steps:
      - uses: actions/checkout@v4 # needed for push-event diffs; PRs use the API
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'cli/**'
              - 'sidecars/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            goassets: # embedded copies in cli/internal/assets; TestEmbeddedAssetsInSync guards drift
              - 'ext/eter/eter.sql'
              - 'demo/schema.sql'
            c:
              - 'ext/eter_ssi/**'
              - '.github/workflows/ci.yml'

  prose-lint:
    name: Prose lint (no AI-tell markers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check prose for em/en dashes, filler words and the LLM lexicon
        run: bash test/lint-prose.sh
      # Proves the rules above can reject something. lint-prose.sh was a silent
      # false green on macOS once (BSD grep has no -P), so it gets a positive test.
      - name: Prove the prose rules can fail
        run: bash test/lint-prose-mutations.sh

  # The site is the launch surface for Phase 3.5, and every rule it satisfies is
  # invisible once satisfied: nobody notices a missing CSP or a 1.3 MB orphaned
  # PNG by looking at the page. This gates site/ against The Website
  # Specification (https://specification.website). It runs offline against the
  # files in the commit, so it needs no network, no browser, and no Netlify
  # deploy, and it cannot go red because a third party changed.
  site-spec:
    name: Site spec (specification.website)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site/ against the spec
        run: bash test/lint-site-spec.sh
      # Then prove the check above can fail. ~60s, one deliberate breakage per
      # rule. A linter made of greps is exactly where a dead check hides: a
      # pattern that stops matching is indistinguishable from a site that
      # stopped violating, and both report green.
      - name: Prove every rule can fail
        run: bash test/lint-site-spec-mutations.sh

  # The two halves of the issue #197 drift guard. Most of the harness suite is
  # local-only (custom engine build, extension toolchain, ~1M-row fixtures), so a
  # change to a shared in-engine contract can break an arbitrary subset of the
  # scripts and go unnoticed until someone next runs one by hand. That is how
  # test/compat.sh stayed broken for three days after #188. The drift risk sits
  # in the harness PREAMBLE rather than the scenario body, and the preamble is
  # cheap to check: a static rule per contract, plus the contract's real
  # behaviour against a stock Postgres. Neither needs the patched engine.
  harness-lint:
    name: Harness lint (in-engine contract opt-in)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check test/ scripts opt into the contracts they call
        run: bash test/lint-harness.sh

  capture-contract:
    name: Capture contract (eter.track refuse/override)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: eter
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Stock Postgres, no patch: the capture contract lives entirely in
      # ext/eter/eter.sql, so observe mode and eter_ssi are not involved.
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Assert the contract the harness preambles depend on
        env:
          ETER_CONTRACT_URL: postgres://postgres:eter@localhost:5432/postgres
          ETER_CONTRACT_LOAD: "1"
        run: bash test/capture-contract.sh

  go:
    name: Go build + vet + test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.goassets == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Sidecars + orchestrator + shared client
        run: cd sidecars && go build ./... && go vet ./... && go test ./...
      - name: CLI
        run: cd cli && go build ./... && go vet ./... && go test ./...

  golangci-lint:
    name: golangci-lint (staticcheck + gosec + leak/perf)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install golangci-lint
        # Build from source (reliable + checksum-safe) rather than the install.sh
        # download, which has hit tarball checksum-verify failures.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - name: Lint (both modules against the shared root .golangci.yml)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          (cd sidecars && golangci-lint run ./...)
          (cd cli && golangci-lint run ./...)

  govulncheck:
    name: govulncheck (known CVEs, reachability)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan both modules
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          (cd sidecars && govulncheck ./...)
          (cd cli && govulncheck ./...)

  cppcheck:
    name: cppcheck (eter_ssi C extension)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.c == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      # No PG headers here, so this is a header-independent pass (memory /
      # resource / portability), NOT a full build-database analysis. Deep,
      # header-aware C analysis (gcc -fanalyzer over eter_ssi.c compiled against
      # the patched PG18 headers) is in the separate c-analysis.yml workflow,
      # which builds .pgbuild18 where eter_ssi.c actually compiles.
      - name: Analyze
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 \
            --inline-suppr --std=c11 \
            --suppress=missingInclude --suppress=missingIncludeSystem \
            ext/eter_ssi/eter_ssi.c
