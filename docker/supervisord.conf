; supervisord config for the bundled control-plane container: the metadata store
; (Postgres) + the capture sidecar + the orchestrator, run as three managed
; processes in one container. supervisord is PID 1 (root) and forwards signals;
; each program drops to the unprivileged `postgres` user.
;
; Ordering: `meta` starts first (priority 10); the capture/orchestrator wrappers
; block on `pg_isready` until the store is up, so a plain priority ordering plus
; the wrappers' readiness wait is enough, and any crash is restarted in place
; WITHOUT bouncing the stateful Postgres.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Expose the control interface over a loopback socket so `supervisorctl` works
; inside the container (status, restart a single program). Without these three
; sections supervisord runs but supervisorctl errors ("ini file does not include
; supervisorctl section").
[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:meta]
command=/usr/local/bin/cp-meta-entrypoint.sh
user=postgres
priority=10
autorestart=true
startsecs=5
; Postgres wants SIGINT for a fast shutdown; SIGTERM is a slower "smart" stop.
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:capture]
command=/usr/local/bin/cp-capture-entrypoint.sh
user=postgres
priority=20
autorestart=true
startretries=1000
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:orchestrator]
command=/usr/local/bin/cp-orchestrator-entrypoint.sh
user=postgres
priority=30
autorestart=true
startretries=1000
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
